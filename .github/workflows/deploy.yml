name: CI/CD Frontend Business Trips

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]            # SemVer-Release-Tags, z. B. v1.2.0
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nie zwei Runs gleichzeitig auf denselben ECS-Service (z. B. Push auf main + Tag-Push):
# bewusst OHNE github.ref, sonst laufen main- und Tag-Run parallel und lösen sich gegenseitig ab
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: react-vite-frontend
  ECS_CLUSTER: biztripsFrontend
  ECS_SERVICE: biztrips-frontend-service
  CONTAINER_NAME: biztrips-frontend
  ALB_NAME: refcard05-frontend-alb

jobs:
  # ---------- Version aus Git-Tag ableiten ----------
  version:
    name: Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # alle Tags holen, sonst findet git describe nichts
      # v1.2.0           -> genau auf einem Release-Tag
      # v1.2.0-3-gabc1234 -> 3 Commits nach v1.2.0 (Commit abc1234)
      # 0.0.0-gabc1234   -> noch kein Tag im Repo
      - id: v
        run: |
          if VERSION=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null); then :; else
            VERSION="0.0.0-g$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------- CI: test → build ----------
  test:
    name: Tests ausführen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: App bauen
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_IMGS: ${{ vars.VITE_IMGS || 'items' }}

  # ---------- RefCard 05: Image nach ECR, Deployment auf ECS (Fargate) ----------
  deploy-ecs:
    name: Image nach ECR pushen und ECS-Service aktualisieren
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Backend-URL prüfen
        run: |
          [ -n "${{ vars.VITE_API_BASE_URL }}" ] || {
            echo "::error::Repository-Variable VITE_API_BASE_URL fehlt (URL des Backend-ALB, mit / am Ende)."
            exit 1
          }

      # AWS Academy Learner Lab: kein OIDC möglich -> temporäre Lab-Credentials als Secrets
      - name: AWS-Credentials aus Learner-Lab-Session beziehen
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Lab-Session prüfen
        run: |
          aws sts get-caller-identity >/dev/null || {
            echo "::error::AWS-Credentials ungültig oder abgelaufen. Lab starten und im Backend-Repo scripts/set-aws-secrets.sh ausführen."
            exit 1
          }

      - name: Bei ECR anmelden
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Image-Tags: <version> (aus Git-Tag), <commit-sha>, latest
      # VITE_API_BASE_URL = URL des Backend-Load-Balancers (wird beim Build fest ins JS einkompiliert)
      # Buildx + GitHub-Actions-Cache: npm ci läuft nur neu, wenn sich package-lock.json ändert
      - uses: docker/setup-buildx-action@v3

      - name: Image bauen und nach ECR pushen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false   # nur das Image selbst, keine zusätzlichen Attestation-Einträge in ECR
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_IMGS=${{ vars.VITE_IMGS || 'items' }}
            APP_VERSION=${{ env.VERSION }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.VERSION }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - id: image
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:$VERSION"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Task-Definition mit neuem Image aktualisieren
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: ECS-Service deployen
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      # Nach dem Deploy prüfen, ob über den Load Balancer wirklich die NEUE Version ausgeliefert wird
      - name: Smoke-Test (Seite + Version über den ALB)
        run: |
          URL="http://$(aws elbv2 describe-load-balancers --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' --output text)"
          for i in $(seq 1 30); do
            DEPLOYED=$(curl -fsS "$URL/version.json" | jq -r .version || true)
            echo "Versuch $i: version=$DEPLOYED (erwartet $VERSION)"
            if [ "$DEPLOYED" = "$VERSION" ] && curl -fsS "$URL/" | grep -q '<div id="root">'; then
              echo "Smoke-Test OK: $URL liefert $VERSION aus" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Frontend liefert nach dem Deploy nicht Version $VERSION aus ($URL)"
          exit 1
